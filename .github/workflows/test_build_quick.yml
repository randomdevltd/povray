name: 'Quick Tests'

on:
  workflow_dispatch:
  push:
    # Feature branches are checked by their pull request; this workflow runs again
    # only where a branch is an integration point.
    branches: [ 'master', 'performance' ]
    # For now, there's nothing in the following directories that we're actually checking.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**' ]
  pull_request:
    # For now, there's nothing in the following directories that we're actually checking.
    paths-ignore: [ 'distribution/**', 'doc/**', 'source-doc/**' ]

# A new push to the same ref replaces the previous run instead of stacking
# another full check beside it (a merged batch of pull requests starts one
# run for the newest merge, not one per merge).
concurrency:
  group: quick-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_unix:
    name: 'Unix Build Test'
    runs-on: ubuntu-latest
    env:
      CCACHE_MAXSIZE: 512M
    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@v7

    - name: 'Compiler Cache'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-quick-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-quick-

    - name: 'Install Prerequisites'
      uses: ./.github/actions/unix_getlibs

    - name: 'Prebuild'
      uses: ./.github/actions/unix_prebuild
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo

    - name: 'Configure'
      uses: ./.github/actions/unix_configure
      with:
        c-compiler: 'ccache gcc'
        cxx-compiler: 'ccache g++'
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo

    - name: 'Bundle Artifacts for Diagnostics'
      if: ${{ always() }}
      uses: ./.github/actions/git_bundle_ignored
      with:
        name: artifact_diag_unix.tar.gz

    - name: 'Build'
      uses: ./.github/actions/unix_make
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo

    - name: 'Check Functionality'
      uses: ./.github/actions/unix_make
      with:
        make-target: check-quick
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo

#    - name: 'Install'
#      uses: ./.github/actions/unix_make
#      with:
#        make-target: install
#    - name: 'Sanity-Check Working Tree'
#      uses: ./.github/actions/git_check_repo

    - name: 'Upload Artifacts for Diagnostics'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: artifact_diag_unix
        path: artifact_diag_unix.tar.gz

    # TODO: Maybe do some basic installation checking.

  build_windows:
    name: 'Windows Build Test'
    runs-on: windows-latest
    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@v7

    - name: 'Add MSBuild to PATH'
      uses: microsoft/setup-msbuild@v3

    - name: 'Build'
      uses: ./.github/actions/windows_build
      with:
        pov-ray-build-id: gh${{github.run_number}}
        solution: vs2015
        configuration: Release
        platform: x64
        toolset: v142
        msbuild-options: ''
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo
