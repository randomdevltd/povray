<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skein-lab</title>
<style>
  :root { --bg: #15171c; --panel: #1d2027; --ink: #d8dce4; --dim: #8a90a0; --line: #2c313b; --accent: #e0a458; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 220px 1fr 440px; }
  aside, section { background: var(--panel); padding: 14px; overflow: auto; }
  aside { border-right: 1px solid var(--line); }
  section { border-left: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  label { display: block; margin: 8px 0; }
  select { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-top: 18px; }
  dt { color: var(--dim); }
  dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; left: 10px; bottom: 8px; color: var(--dim); }
</style>
</head>
<body>
<aside>
  <h1>skein-lab</h1>
  <label>example <select id="example"></select></label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="normals"> normal shading</label>
  <dl>
    <dt>grid</dt><dd id="m-grid"></dd>
    <dt>area</dt><dd id="m-area"></dd>
    <dt>volume</dt><dd id="m-volume"></dd>
    <dt>seam gap</dt><dd id="m-seam"></dd>
    <dt>self-x (40²)</dt><dd id="m-self"></dd>
    <dt>build</dt><dd id="m-time"></dd>
  </dl>
</aside>
<div id="view"><div id="status"></div></div>
<section><pre id="source"></pre></section>
<script type="module" src="main.js"></script>
</body>
</html>
