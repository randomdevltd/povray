name: 'Full Check'

on:
  workflow_dispatch:
  schedule:
    # Nightly, on the default branch.
    - cron: '37 3 * * *'
  push:
    # The expensive render suites run where changes land, not on every pull request.
    branches: [ 'master', 'performance' ]

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_unix:
    name: 'Unix Full Check'
    runs-on: ubuntu-latest
    env:
      CCACHE_MAXSIZE: 512M
    steps:

    - name: 'Check out Repository'
      uses: actions/checkout@v7

    - name: 'Compiler Cache'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-full-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-full-

    - name: 'Install Prerequisites'
      uses: ./.github/actions/unix_getlibs

    - name: 'Prebuild'
      uses: ./.github/actions/unix_prebuild

    - name: 'Configure'
      uses: ./.github/actions/unix_configure
      with:
        c-compiler: 'ccache gcc'
        cxx-compiler: 'ccache g++'

    - name: 'Build'
      uses: ./.github/actions/unix_make

    - name: 'Check Functionality'
      uses: ./.github/actions/unix_make
      with:
        make-target: check

    - name: 'Upload Artifacts for Diagnostics'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: artifact_diag_unix_full
        path: artifact_diag_unix.tar.gz
